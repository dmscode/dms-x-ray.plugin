# X-Ray 插件自动发布工作流
# 触发：推送 v* 形式标签（如 v0.1.0）→ 将 dms-x-ray.koplugin 文件夹打包为
#       DMS-X-Ray.<标签名>.zip（zip 顶层即插件文件夹）→ 创建该标签的 GitHub Release 并上传 zip。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package plugin as zip (folder-inclusive)
        # zip 顶层保留 dms-x-ray.koplugin 目录，符合"打包包含文件夹"预期
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          zip -r "dist/DMS-X-Ray.${TAG}.zip" dms-x-ray.koplugin

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false