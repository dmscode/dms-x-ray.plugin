# X-Ray 插件自动发布工作流
# 触发：推送 v* 形式标签（如 v0.1.0）→ 将 dms-x-ray.koplugin 文件夹打包为
#       DMS-X-Ray.<标签名>.zip（zip 顶层即插件文件夹）→ 创建该标签的 GitHub Release 并上传 zip。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # fetch-depth: 0 拉取完整 git 历史，供 release notes 脚本比对「上一标签 → 当前标签」区间
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package plugin as zip (folder-inclusive)
        # zip 顶层保留 dms-x-ray.koplugin 目录，符合"打包包含文件夹"预期
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          zip -r "dist/DMS-X-Ray.${TAG}.zip" dms-x-ray.koplugin

      - name: Generate Chinese release notes
        # 用 tools/gen_release_notes.py 依提交历史生成中文说明；
        # 自动比对当前标签的前一个 v* 标签（首个版本则列全部提交）
        run: |
          python3 tools/gen_release_notes.py --tag "${{ github.ref_name }}" --out release-notes.md

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*.zip
          draft: false
          prerelease: false